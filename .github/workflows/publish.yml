name: Stage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  verify-npm:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Get Version
        id: vars
        run: echo ::set-output name=version::$(echo ${{github.ref_name}} | sed 's/^v//')

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup npm with staged publishing
        run: npm install --global npm@11.21.0

      - name: Build NPM
        run: deno task build:npm ${{steps.vars.outputs.version}}

      - name: dry run staged publish
        run: npm stage publish --dry-run --access=public --tag=verify
        working-directory: ./build/npm

      - name: upload build
        uses: actions/upload-artifact@v4
        with:
          name: npm-build
          path: ./build/npm
          include-hidden-files: true

  stage-npm:
    needs: verify-npm
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup npm with staged publishing
        run: npm install --global npm@11.21.0

      - name: download build
        uses: actions/download-artifact@v4
        with:
          name: npm-build
          path: ./build/npm

      - name: Stage NPM publish
        run: npm stage publish --access=public --tag=latest
        working-directory: ./build/npm
